<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ЧЕРТА — минималистичный tower defense</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cg stroke='%23f2f2ee' stroke-width='2' stroke-linecap='round' fill='none'%3E%3Ccircle cx='16' cy='7' r='3.4'/%3E%3Cpath d='M16 11v9M16 13l-6 5M16 13l7 4M16 20l-5 8M16 20l5 8'/%3E%3C/g%3E%3Cpath d='M4 29h24' stroke='%2346f28e' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="grain"></div><div id="vig"></div><div id="lowhp"></div>
<canvas id="scene"></canvas>

<!-- ======= ГЛАВНОЕ МЕНЮ ======= -->
<div id="menu" class="layer">
  <header class="m-top">
    <div class="m-logo">ЧЕРТА
      <svg viewBox="0 0 120 8"><path d="M2 5Q22 1 44 4T86 4T118 3"/></svg>
      <span>tower defense · бесконечная оборона</span>
    </div>
    <div class="m-meta">
      <span id="mGold" class="gold">¤ 0</span>
      <span id="mLvl">УР. 1</span>
      <button id="mSound" class="ibtn icon" aria-label="звук"></button>
    </div>
  </header>
  <nav id="mNav" class="m-nav" aria-label="меню"></nav>
  <footer class="m-foot">
    <div id="mStats" class="m-stats"></div>
    <div class="m-hint">↑↓ — выбор · ENTER — открыть · SPACE / клик — взмах оружием</div>
  </footer>
</div>

<!-- ======= БОЙ ======= -->
<div id="battle" class="layer hidden">
  <div class="b-top">
    <div class="b-bar">
      <label>ПРОЧНОСТЬ</label>
      <div class="bar sk" id="hpBar"><i id="hpFill"></i></div>
      <span id="hpText"></span>
    </div>
    <div class="b-wave">
      <div id="waveNum">ГОТОВЬСЯ</div>
      <div id="waveSub"></div>
      <div id="bossWrap" class="hidden"><span id="bossName">КОЛОСС</span>
        <div class="bar sk boss"><i id="bossFill"></i></div></div>
      <button id="btnNext" class="ibtn small hidden">ВОЛНА 1 ▶</button>
    </div>
    <div class="b-bar right">
      <label>УРОВЕНЬ <b id="lvlNum">1</b> <button id="ptsBtn" class="pts hidden">+0</button></label>
      <div class="bar sk"><i id="xpFill" class="xp"></i></div>
      <span id="xpText"></span>
      <div class="b-ctrl">
        <button id="btnPause" class="ibtn icon" aria-label="пауза">⏸</button>
        <button id="btnSpeed" class="ibtn icon" aria-label="скорость">1×</button>
        <button id="btnSound" class="ibtn icon" aria-label="звук"></button>
      </div>
    </div>
  </div>
  <div id="banner" class="hidden"><b id="bannerT"></b><span id="bannerS"></span></div>
  <div class="b-bottom">
    <div class="b-posts">
      <button id="post0" class="post sk"></button>
      <button id="post1" class="post sk"></button>
    </div>
    <div class="b-weapon"><b id="wName"></b><span id="wHint">клик / SPACE — вихрь · E — ярость</span></div>
    <div class="b-nums"><span class="gold">¤ <b id="goldVal">0</b></span><span class="dim">✕ <b id="killVal">0</b></span></div>
    <div class="b-abs">
      <button id="ab1" class="ab sk"><b>ВИХРЬ</b><kbd>SPC</kbd><i id="ab1cd"></i><em id="ab1s"></em></button>
      <button id="ab2" class="ab sk"><b>ЯРОСТЬ</b><kbd>E</kbd><i id="ab2cd"></i><em id="ab2s"></em></button>
    </div>
  </div>
  <div id="pauseVeil" class="hidden">
    <div class="pv sk">
      <h2>ПАУЗА</h2>
      <button id="btnResume" class="ibtn fill">ПРОДОЛЖИТЬ</button>
      <button id="btnAbandon" class="ibtn red">ЗАВЕРШИТЬ ЗАБЕГ</button>
      <p>P / ESC — пауза · M — звук<br>прогресс сохранится</p>
    </div>
  </div>
</div>

<!-- ======= ЛИСТ (арсенал / прокачка / рекорды / настройки) ======= -->
<aside id="sheet" class="hidden">
  <button id="sheetClose" class="ibtn icon" aria-label="закрыть">✕</button>
  <div id="sheetBody"></div>
</aside>

<div id="pop" class="sk hidden"></div>

<!-- ======= ИТОГИ ЗАБЕГА ======= -->
<div id="summary" class="hidden">
  <div class="sum sk">
    <div id="sumTitle" class="sum-title">ЧЕРТА ПРОРВАНА</div>
    <div class="sum-wave"><span>ДОШЁЛ ДО ВОЛНЫ</span><b id="sumWave">1</b><em id="sumRecord" class="hidden">НОВЫЙ РЕКОРД</em></div>
    <div class="sum-grid">
      <div><label>УБИЙСТВ</label><b id="sumKills"></b></div>
      <div><label>ВРЕМЯ</label><b id="sumTime"></b></div>
      <div><label>УРОВНИ</label><b id="sumLvl" class="acc"></b></div>
      <div><label>ЗОЛОТО</label><b id="sumGold" class="gold"></b></div>
      <div><label>ОПЫТ</label><b id="sumXp" class="acc"></b></div>
      <div><label>БОЕЦ</label><b id="sumLevel"></b></div>
    </div>
    <div class="sum-send">
      <input id="sumNick" maxlength="16" spellcheck="false" placeholder="ПОЗЫВНОЙ">
      <button id="btnSubmit" class="ibtn fill small">ОТПРАВИТЬ РЕКОРД</button>
      <div id="submitStatus"></div>
    </div>
    <div class="sum-actions">
      <button id="btnAgain" class="ibtn fill">ЕЩЁ ЗАБЕГ</button>
      <button id="btnMenu" class="ibtn">В МЕНЮ</button>
    </div>
  </div>
</div>

<div id="toasts"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
